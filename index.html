<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حلول CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: right-hand brand sidebar + working area; background family (white / Hulool teal / Hulool sand) x (light / dark) */
:root{
  --font-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --font-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --brand-teal:#1f656f; --brand-sand:#b2a68f;

  --bg:#ffffff; --surface:#ffffff; --surface-2:#f3f6f6; --line:#e2e8e8;
  --fg:#18282b; --muted:#5d6f72; --accent:#1f656f; --accent-fg:#ffffff; --accent-soft:#e3eff0;
  --sand:#8a7c5f; --sand-soft:#f3efe6;
  --side-bg:#ffffff; --side-fg:#18282b; --side-muted:#6b7b7e; --side-active:#e3eff0; --side-active-fg:#1f656f; --side-line:#e2e8e8;
  --logo-mark:#1f656f; --logo-word:#b2a68f;
  --good:#1e7a4f; --good-soft:#e2f2ea; --warn:#9a6a12; --warn-soft:#f8eed9; --bad:#a63d32; --bad-soft:#f7e3e0;
  --shadow:0 1px 2px rgba(20,40,44,.06),0 6px 20px rgba(20,40,44,.06);
}
:root[data-bg="teal"]{
  --bg:#e9f2f3; --surface:#ffffff; --surface-2:#f1f7f7; --line:#d3e3e5;
  --side-bg:#1f656f; --side-fg:#ffffff; --side-muted:#b9d4d7; --side-active:rgba(255,255,255,.14); --side-active-fg:#ffffff; --side-line:rgba(255,255,255,.14);
  --logo-mark:#ffffff; --logo-word:#d8ccb3;
}
:root[data-bg="sand"]{
  --bg:#f5f1e9; --surface:#fffdf9; --surface-2:#f8f4ec; --line:#e6dfd0;
  --fg:#24221b; --muted:#6b6453;
  --side-bg:#b2a68f; --side-fg:#1f1c14; --side-muted:#433d2e; --side-active:rgba(255,255,255,.38); --side-active-fg:#14363b; --side-line:rgba(31,28,20,.14);
  --logo-mark:#1f656f; --logo-word:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111616; --surface:#182020; --surface-2:#1e2828; --line:#2a3637;
    --fg:#e6eeee; --muted:#9db0b2; --accent:#5fb3be; --accent-fg:#0b1f22; --accent-soft:#1d3a3e;
    --sand:#cbbd9f; --sand-soft:#2a271f;
    --side-bg:#141b1b; --side-fg:#e6eeee; --side-muted:#93a6a8; --side-active:#1d3a3e; --side-active-fg:#8fd3db; --side-line:#243031;
    --logo-mark:#5fb3be; --logo-word:#b2a68f;
    --good:#5cc595; --good-soft:#163428; --warn:#e2b35a; --warn-soft:#382b12; --bad:#ec8a7e; --bad-soft:#3b1d19;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
  :root[data-bg="teal"]:not([data-theme="light"]){
    --bg:#0b2226; --surface:#112f34; --surface-2:#15383e; --line:#1f4950;
    --side-bg:#08191c; --side-active:#1a4c53; --side-line:#173a3f; --logo-mark:#7cc6cf;
  }
  :root[data-bg="sand"]:not([data-theme="light"]){
    --bg:#1b1914; --surface:#24211a; --surface-2:#2c2920; --line:#3a352a;
    --fg:#eee8dc; --muted:#b3a991;
    --side-bg:#141310; --side-fg:#eee8dc; --side-muted:#a89e86; --side-active:#3a3427; --side-active-fg:#e6d8b8; --side-line:#2c2920;
    --logo-mark:#5fb3be; --logo-word:#cbbd9f;
  }
}
:root[data-theme="dark"]{
  --bg:#111616; --surface:#182020; --surface-2:#1e2828; --line:#2a3637;
  --fg:#e6eeee; --muted:#9db0b2; --accent:#5fb3be; --accent-fg:#0b1f22; --accent-soft:#1d3a3e;
  --sand:#cbbd9f; --sand-soft:#2a271f;
  --side-bg:#141b1b; --side-fg:#e6eeee; --side-muted:#93a6a8; --side-active:#1d3a3e; --side-active-fg:#8fd3db; --side-line:#243031;
  --logo-mark:#5fb3be; --logo-word:#b2a68f;
  --good:#5cc595; --good-soft:#163428; --warn:#e2b35a; --warn-soft:#382b12; --bad:#ec8a7e; --bad-soft:#3b1d19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
:root[data-theme="dark"][data-bg="teal"]{
  --bg:#0b2226; --surface:#112f34; --surface-2:#15383e; --line:#1f4950;
  --side-bg:#08191c; --side-active:#1a4c53; --side-line:#173a3f; --logo-mark:#7cc6cf;
}
:root[data-theme="dark"][data-bg="sand"]{
  --bg:#1b1914; --surface:#24211a; --surface-2:#2c2920; --line:#3a352a;
  --fg:#eee8dc; --muted:#b3a991;
  --side-bg:#141310; --side-fg:#eee8dc; --side-muted:#a89e86; --side-active:#3a3427; --side-active-fg:#e6d8b8; --side-line:#2c2920;
  --logo-mark:#5fb3be; --logo-word:#cbbd9f;
}

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;transition:background-color .25s ease}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}

/* sidebar */
.side{background:var(--side-bg);color:var(--side-fg);border-inline-end:1px solid var(--side-line);display:flex;flex-direction:column;gap:22px;padding-block:22px;padding-inline:16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;transition:background-color .25s ease}
.brand{display:flex;align-items:center;padding-inline:6px}
.brand-logo{width:178px;max-width:100%;height:auto;display:block}
.brand-logo path,.brand-logo use{transition:fill .25s ease}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-label{font-size:12px;letter-spacing:.02em;color:var(--side-muted);padding-inline:10px;margin-block-end:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-fg);font-weight:500}
.nav button svg{width:20px;height:20px;flex:none;opacity:.85}
.nav button:hover{background:var(--side-active)}
.nav button[aria-current="page"]{background:var(--side-active);color:var(--side-active-fg);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--side-fg)}
.nav .count{margin-inline-start:auto;font-size:12px;font-variant-numeric:tabular-nums;color:var(--side-muted)}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--side-line)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--brand-sand);color:#1f1c14;font-weight:600;font-family:var(--font-display);flex:none}
.side-foot small{display:block;color:var(--side-muted);font-size:12px;line-height:1.3}

/* main */
.main{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top h1{font-family:var(--font-display);font-size:20px;font-weight:600;margin:0;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;width:240px}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;outline:0;width:100%;min-width:0}
.icon-btn{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--fg);position:relative;transition:background-color .2s}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:19px;height:19px}
.icon-btn .dot{position:absolute;inset-block-end:6px;inset-inline-end:6px;width:9px;height:9px;border-radius:50%;border:2px solid var(--surface);background:var(--swatch-now,#fff)}

/* theme popover */
.pop{position:absolute;top:calc(100% + 8px);inset-inline-end:0;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:14px;z-index:20}
.pop h3{margin:0;font-family:var(--font-display);font-size:15px;font-weight:600}
.pop .hint{margin:0;color:var(--muted);font-size:13px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.swatch{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);font-size:12.5px;text-align:center}
.swatch i{width:34px;height:34px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.12);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.swatch[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);font-weight:600}
.mode-row{display:flex;gap:8px;background:var(--surface-2);padding:4px;border-radius:11px}
.mode-row button{all:unset;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:8px;font-size:13.5px}
.mode-row button svg{width:16px;height:16px}
.mode-row button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:600}

.content{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.sample-note{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sand);background:var(--sand-soft);padding:4px 10px;border-radius:999px;align-self:flex-start}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi span{color:var(--muted);font-size:13px}
.kpi b{font-family:var(--font-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi b small{font-size:14px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.kpi em{font-style:normal;font-size:12.5px;color:var(--good)}
.kpi em.down{color:var(--bad)}

.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.panel-head{display:flex;align-items:baseline;gap:10px}
.panel-head h2{margin:0;font-family:var(--font-display);font-size:16px;font-weight:600}
.panel-head .meta{margin-inline-start:auto;color:var(--muted);font-size:13px}

.funnel{display:flex;flex-direction:column;gap:12px}
.f-row{display:grid;grid-template-columns:96px minmax(0,1fr) 120px;align-items:center;gap:12px;font-size:14px}
.f-bar{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.f-bar i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.f-row:nth-child(even) .f-bar i{background:var(--brand-sand)}
.f-row .v{text-align:left;font-variant-numeric:tabular-nums;color:var(--muted);direction:ltr}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding-block:11px;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.when{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--accent-soft);color:var(--accent);padding:4px 0;line-height:1.25;font-family:var(--font-display)}
.when b{display:block;font-size:17px}
.when small{font-size:11px}
.li .txt{min-width:0}
.li .txt b{font-weight:600;display:block}
.li .txt small{color:var(--muted);font-size:13px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-new{background:var(--accent-soft);color:var(--accent)}
.p-view{background:var(--sand-soft);color:var(--sand)}
.p-neg{background:var(--warn-soft);color:var(--warn)}
.p-sign{background:var(--good-soft);color:var(--good)}
.p-won{background:var(--good-soft);color:var(--good)}
.p-lost{background:var(--bad-soft);color:var(--bad)}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:right;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12.5px;font-weight:500;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td .num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
td .name{font-weight:600}
td .phone{color:var(--muted);font-size:13px;direction:ltr;display:inline-block}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:14px}
.btn svg{width:17px;height:17px}

.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.prop{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.prop .ph{aspect-ratio:16/9;max-width:100%;position:relative;display:grid;place-items:center}
.prop .ph svg{width:46%;height:auto;opacity:.9}
.prop .ph .pill{position:absolute;top:10px;inset-inline-start:10px;background:var(--surface);}
.prop .body{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.prop h3{margin:0;font-size:15.5px;font-weight:600;font-family:var(--font-display)}
.prop .loc{color:var(--muted);font-size:13px}
.specs{display:flex;gap:14px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.price{font-family:var(--font-display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.price small{font-size:12.5px;color:var(--muted);font-weight:400}
.code{font-size:12px;color:var(--muted);direction:ltr;margin-inline-start:auto}

.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.col-head .n{font-size:12px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.col-head .sum{margin-inline-start:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card b{font-weight:600;font-size:14px}
.card small{color:var(--muted);font-size:12.5px}
.card .row{display:flex;align-items:center;gap:8px}
.card .amt{font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px}
.mini-av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent);margin-inline-start:auto}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);z-index:40}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-2{grid-template-columns:minmax(0,1fr)}.search{width:180px}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:column;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-inline-end:0;border-bottom:1px solid var(--side-line)}
  .brand-logo{width:140px}
  .nav{flex-direction:row;overflow-x:auto;gap:6px}
  .nav-label,.nav .count,.side-foot{display:none}
  .nav button{white-space:nowrap;padding:8px 12px}
  .top,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .search{display:none}
  .top .sub{display:none}
}
@media (max-width:480px){.kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.kpi b{font-size:21px}.f-row{grid-template-columns:76px minmax(0,1fr) 92px}.pop{width:min(280px,calc(100vw - 32px))}}
</style>
<style>body{margin:0}img{max-width:100%}</style>

<script>
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11Z"/></svg>';
const SW={white:'#ffffff',teal:'#1f656f',sand:'#b2a68f'};
const BGNAME={white:'الأبيض',teal:'التركوازي',sand:'الرملي'};
const root=document.documentElement;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function currentMode(){
  const t=root.getAttribute('data-theme');
  if(t) return t;
  return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
}
function applyMode(m){
  root.setAttribute('data-theme',m);
  document.getElementById('mode-btn').innerHTML=m==='dark'?SUN:MOON;
  document.getElementById('mode-btn').title=m==='dark'?'الوضع الفاتح':'الوضع الداكن';
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));
}
function applyBg(bg){
  root.setAttribute('data-bg',bg);
  document.querySelectorAll('.swatch').forEach(s=>s.setAttribute('aria-checked',s.dataset.bg===bg));
  root.style.setProperty('--swatch-now',SW[bg]);
}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800)}

applyBg(store.get('hulool-bg')||'white');
applyMode(store.get('hulool-mode')||currentMode());

document.getElementById('mode-btn').onclick=()=>{const m=currentMode()==='dark'?'light':'dark';applyMode(m);store.set('hulool-mode',m);toast(m==='dark'?'تم تفعيل الوضع الداكن':'تم تفعيل الوضع الفاتح')};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{applyMode(b.dataset.mode);store.set('hulool-mode',b.dataset.mode)});
document.querySelectorAll('.swatch').forEach(s=>s.onclick=()=>{applyBg(s.dataset.bg);store.set('hulool-bg',s.dataset.bg);toast('تم تطبيق اللون '+BGNAME[s.dataset.bg])});
const pop=document.getElementById('pop'),palBtn=document.getElementById('pal-btn');
palBtn.onclick=e=>{e.stopPropagation();pop.hidden=!pop.hidden;palBtn.setAttribute('aria-expanded',!pop.hidden)};
pop.onclick=e=>e.stopPropagation();
document.addEventListener('click',()=>{pop.hidden=true;palBtn.setAttribute('aria-expanded','false')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){pop.hidden=true;palBtn.setAttribute('aria-expanded','false')}});

const stage=k=>STAGES.find(s=>s.k===k);
const clients=[
  {n:'فهد العتيبي',ph:'050 412 ** 18',want:'شراء فيلا',dist:'أبحر الشمالية',budget:3200000,st:'neg',ag:'أحمد',last:'اليوم'},
  {n:'نورة الزهراني',ph:'055 908 ** 41',want:'شراء شقة',dist:'الروضة',budget:1150000,st:'view',ag:'منى',last:'أمس'},
  {n:'عبدالله الغامدي',ph:'054 220 ** 07',want:'إيجار مكتب',dist:'الحمراء',budget:180000,st:'new',ag:'يوسف',last:'اليوم'},
  {n:'ريم القحطاني',ph:'056 731 ** 92',want:'شراء دوبلكس',dist:'النعيم',budget:1850000,st:'sign',ag:'منى',last:'منذ 3 أيام'},
  {n:'ماجد الحربي',ph:'053 145 ** 66',want:'شراء أرض',dist:'الشراع',budget:2400000,st:'view',ag:'أحمد',last:'أمس'},
  {n:'سارة الشهري',ph:'059 664 ** 30',want:'إيجار شقة',dist:'السلامة',budget:65000,st:'won',ag:'يوسف',last:'منذ أسبوع'},
  {n:'خالد المالكي',ph:'050 873 ** 55',want:'شراء فيلا',dist:'الشاطئ',budget:5600000,st:'neg',ag:'أحمد',last:'منذ يومين'},
  {n:'هند السبيعي',ph:'055 317 ** 24',want:'شراء شقة',dist:'المحمدية',budget:980000,st:'new',ag:'منى',last:'اليوم'},
  {n:'تركي الدوسري',ph:'054 590 ** 83',want:'إيجار فيلا',dist:'الزهراء',budget:140000,st:'view',ag:'يوسف',last:'منذ يومين'},
  {n:'لمى العمري',ph:'056 482 ** 19',want:'شراء شقة',dist:'الصفا',budget:760000,st:'won',ag:'منى',last:'منذ 5 أيام'},
  {n:'سلطان الشمري',ph:'053 709 ** 62',want:'شراء عمارة',dist:'الفيصلية',budget:8900000,st:'new',ag:'أحمد',last:'أمس'},
  {n:'دانة الجهني',ph:'059 116 ** 74',want:'شراء دوبلكس',dist:'أبحر الجنوبية',budget:2100000,st:'sign',ag:'يوسف',last:'اليوم'}
];
const props=[
  {code:'HR-1042',t:'شقة 4 غرف بإطلالة',type:'شقة',dist:'الروضة',area:210,rooms:4,price:1180000,deal:'بيع',st:'متاح'},
  {code:'HR-1057',t:'فيلا دورين مع مسبح',type:'فيلا',dist:'أبحر الشمالية',area:540,rooms:6,price:3350000,deal:'بيع',st:'محجوز'},
  {code:'HR-1063',t:'مكتب إداري مؤثث',type:'مكتب',dist:'الحمراء',area:160,rooms:3,price:175000,deal:'إيجار',st:'متاح'},
  {code:'HR-1071',t:'دوبلكس زاوية',type:'دوبلكس',dist:'النعيم',area:320,rooms:5,price:1890000,deal:'بيع',st:'محجوز'},
  {code:'HR-1078',t:'أرض سكنية على شارعين',type:'أرض',dist:'الشراع',area:900,rooms:0,price:2350000,deal:'بيع',st:'متاح'},
  {code:'HR-1084',t:'شقة عائلية حديثة',type:'شقة',dist:'السلامة',area:175,rooms:3,price:62000,deal:'إيجار',st:'مؤجر'},
  {code:'HR-1090',t:'فيلا على البحر',type:'فيلا',dist:'الشاطئ',area:780,rooms:7,price:5900000,deal:'بيع',st:'متاح'},
  {code:'HR-1096',t:'عمارة سكنية 12 وحدة',type:'عمارة',dist:'الفيصلية',area:1100,rooms:12,price:9200000,deal:'بيع',st:'متاح'}
];
const viewings=[
  {d:'16',m:'أكتوبر',who:'نورة الزهراني',what:'معاينة شقة HR-1042 — الروضة',at:'4:30 م'},
  {d:'16',m:'أكتوبر',who:'ماجد الحربي',what:'زيارة أرض HR-1078 — الشراع',at:'6:00 م'},
  {d:'18',m:'أكتوبر',who:'تركي الدوسري',what:'معاينة فيلا للإيجار — الزهراء',at:'5:15 م'},
  {d:'19',m:'أكتوبر',who:'دانة الجهني',what:'توقيع عقد دوبلكس — أبحر الجنوبية',at:'11:00 ص'}
];

const fmt=n=>n.toLocaleString('en-US');
const short=n=>n>=1e6?(+(n/1e6).toFixed(1))+' مليون':n>=1e3?Math.round(n/1e3)+' ألف':String(n);
const initial=s=>s.trim()[0];

document.getElementById('c-clients').textContent=clients.length;
document.getElementById('c-props').textContent=props.length;
document.getElementById('c-deals').textContent=clients.filter(c=>c.st!=='won').length;

const VIEWS={
  dash:{title:'لوحة التحكم',sub:'نظرة عامة على أداء أكتوبر 2026'},
  clients:{title:'العملاء',sub:'كل العملاء ومرحلة كل واحد منهم'},
  props:{title:'العقارات',sub:'المعروض الحالي للبيع والإيجار في جدة'},
  deals:{title:'الصفقات',sub:'مسار الصفقات من أول تواصل حتى الإغلاق'}
};
let view='dash',filter='all',q='';
const note='<span class="sample-note">بيانات تجريبية للعرض</span>';

function houseIcon(type){
  return '<svg viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">'+
   (type==='أرض'?'<path d="M4 34h56M8 34l10-12 10 8 12-16 16 20"/>':
    type==='عمارة'||type==='مكتب'?'<rect x="18" y="4" width="28" height="32" rx="1"/><path d="M24 10h4M36 10h4M24 17h4M36 17h4M24 24h4M36 24h4M29 36v-6h6v6"/>':
    '<path d="M10 36V18L32 4l22 14v18M4 36h56"/><path d="M27 36V26h10v10M16 22h6v6h-6zM42 22h6v6h-6z"/>')+'</svg>';
}

function render(){
  const v=VIEWS[view];
  document.getElementById('view-title').textContent=v.title;
  document.getElementById('view-sub').textContent=v.sub;
  document.querySelectorAll('.nav button').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  const el=document.getElementById('content');
  const ql=q.trim();
  const match=s=>!ql||s.includes(ql);

  if(view==='dash'){
    const open=clients.filter(c=>c.st!=='won');
    const pipe=open.reduce((a,c)=>a+c.budget,0);
    const byStage=STAGES.map(s=>({...s,sum:clients.filter(c=>c.st===s.k).reduce((a,c)=>a+c.budget,0),n:clients.filter(c=>c.st===s.k).length}));
    const max=Math.max(...byStage.map(s=>s.sum));
    el.innerHTML=note+`
    <section class="kpis">
      <div class="kpi"><span>عملاء جدد هذا الشهر</span><b>${clients.filter(c=>c.st==='new').length+21}</b><em>▲ 18٪ عن سبتمبر</em></div>
      <div class="kpi"><span>صفقات مفتوحة</span><b>${open.length}</b><em>▲ 3 صفقات</em></div>
      <div class="kpi"><span>قيمة الصفقات المفتوحة</span><b>${(+(pipe/1e6).toFixed(1))}<small>مليون ر.س</small></b><em>▲ 9٪</em></div>
      <div class="kpi"><span>عقارات متاحة</span><b>${props.filter(p=>p.st==='متاح').length}</b><em class="down">▼ عقاران</em></div>
    </section>
    <section class="grid-2">
      <div class="panel">
        <div class="panel-head"><h2>قيمة الصفقات حسب المرحلة</h2><span class="meta">بالريال السعودي</span></div>
        <div class="funnel">${byStage.map(s=>`<div class="f-row"><span>${s.name}</span><div class="f-bar"><i style="width:${Math.max(4,s.sum/max*100)}%"></i></div><span class="v">${fmt(s.sum)}</span></div>`).join('')}</div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>المواعيد القادمة</h2><span class="meta">${viewings.length} مواعيد</span></div>
        <div class="list">${viewings.map(x=>`<div class="li"><div class="when"><b>${x.d}</b><small>${x.m}</small></div><div class="txt"><b>${x.who}</b><small>${x.what} · ${x.at}</small></div></div>`).join('')}</div>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>آخر العملاء</h2><span class="meta">آخر تواصل</span></div>
      <div class="table-wrap" style="border:0">${clientTable(clients.filter(c=>match(c.n)||match(c.dist)).slice(0,5))}</div>
    </section>`;
  }
  if(view==='clients'){
    const list=clients.filter(c=>(filter==='all'||c.st===filter)&&(match(c.n)||match(c.dist)||match(c.want)));
    el.innerHTML=`<div class="toolbar">${[{k:'all',name:'الكل'},...STAGES].map(s=>`<button class="chip" data-f="${s.k}" aria-pressed="${filter===s.k}">${s.name}</button>`).join('')}<span style="flex:1"></span><button class="btn" data-add><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>عميل جديد</button></div>
    <div class="table-wrap">${clientTable(list)}</div>`+note;
  }
  if(view==='props'){
    const list=props.filter(p=>match(p.t)||match(p.dist)||match(p.type)||match(p.code));
    const stCls={'متاح':'p-sign','محجوز':'p-neg','مؤجر':'p-view'};
    el.innerHTML=note+`<div class="props">${list.map((p,i)=>`<article class="prop">
      <div class="ph" style="background:${i%2?'var(--sand-soft)':'var(--accent-soft)'};color:${i%2?'var(--sand)':'var(--accent)'}">${houseIcon(p.type)}<span class="pill ${stCls[p.st]}">${p.st}</span></div>
      <div class="body">
        <div style="display:flex;align-items:baseline;gap:8px"><h3>${p.t}</h3></div>
        <div class="loc">${p.type} · حي ${p.dist}، جدة</div>
        <div class="specs"><span>${p.area} م²</span>${p.rooms?`<span>${p.rooms} ${p.type==='عمارة'?'وحدة':'غرف'}</span>`:''}<span>${p.deal}</span><span class="code">${p.code}</span></div>
        <div class="price">${fmt(p.price)} <small>ر.س${p.deal==='إيجار'?' / سنوياً':''}</small></div>
      </div></article>`).join('')||'<p>لا توجد عقارات مطابقة للبحث.</p>'}</div>`;
  }
  if(view==='deals'){
    el.innerHTML=note+`<div class="board">${STAGES.map(s=>{const cs=clients.filter(c=>c.st===s.k&&(match(c.n)||match(c.dist)));return `<div class="col"><div class="col-head"><span class="pill ${s.cls}">${s.name}</span><span class="n">${cs.length}</span><span class="sum">${short(cs.reduce((a,c)=>a+c.budget,0))}</span></div>${cs.map(c=>`<div class="card"><b>${c.n}</b><small>${c.want} · ${c.dist}</small><div class="row"><span class="amt">${fmt(c.budget)} ر.س</span><span class="mini-av" title="${c.ag}">${initial(c.ag)}</span></div></div>`).join('')}</div>`}).join('')}</div>`;
  }
}
function clientTable(list){
  if(!list.length) return '<p style="padding:16px;margin:0;color:var(--muted)">لا يوجد عملاء مطابقون.</p>';
  return `<table><thead><tr><th>العميل</th><th>الطلب</th><th>الحي</th><th>الميزانية (ر.س)</th><th>المرحلة</th><th>الوسيط</th><th>آخر تواصل</th></tr></thead><tbody>${list.map(c=>{const s=stage(c.st);return `<tr><td><div class="name">${c.n}</div><span class="phone">${c.ph}</span></td><td>${c.want}</td><td>${c.dist}</td><td><span class="num">${fmt(c.budget)}</span></td><td><span class="pill ${s.cls}">${s.name}</span></td><td>${c.ag}</td><td>${c.last}</td></tr>`}).join('')}</tbody></table>`;
}

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;filter='all';render();window.scrollTo({top:0})});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;render()});
document.getElementById('content').addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;render();return}
  if(e.target.closest('[data-add]')) toast('إضافة العملاء تعمل في النسخة الكاملة من النظام');
});
render();
</script>

</body>
</html>
